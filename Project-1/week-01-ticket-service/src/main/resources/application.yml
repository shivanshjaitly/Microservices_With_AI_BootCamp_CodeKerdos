server:
  port: 8080

spring:
  application:
    name: ticket-service
  profiles:
    active: h2

app:
  classifier-service:
    base-url: ${CLASSIFIER_SERVICE_BASE_URL:http://localhost:8090}
    timeout-ms: 4000

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
---
spring:
   config:
     activate:
       on-profile: h2
   datasource:
     url: jdbc:h2:mem:ticketdb
     driver-class-name: org.h2.Driver
     username: sa
     password: 
   h2:
     console:
       enabled: true
       path: /h2-console
   jpa:
     hibernate:
       ddl-auto: update
     show-sql: true
     properties:
       hibernate:
         format_sql: true
---
spring:
  config:
    activate:
      on-profile: postgres
  datasource:
    url: jdbc:postgresql://localhost:5432/ticket_db
    username: ticket
    password: ticket
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true