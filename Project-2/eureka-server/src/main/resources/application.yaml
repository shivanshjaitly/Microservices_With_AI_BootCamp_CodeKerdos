server:
  port: 8761

spring:
  application:
    name: eureka-server

# Standalone registry — it does not register itself, and does not need to
# fetch a registry from anywhere else (there is only ever one instance of
# this service in Project 2).
eureka:
  client:
    register-with-eureka: false
    fetch-registry: false
    service-url:
      defaultZone: http://localhost:8761/eureka
  server:
    # Dev-friendly: don't hold onto stale instance leases when services are
    # stopped/restarted frequently while working through the bootcamp.
    enable-self-preservation: false
    eviction-interval-timer-in-ms: 5000
  instance:
    hostname: localhost

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics