server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      # Explicit routes (not the discovery locator) — clearer to teach and to
      # read than magic auto-generated /<service-id>/** routes. Route id ==
      # the target Eureka application name in every case, per docs/PROJECT2_SPEC.md.
      routes:
        - id: order-service
          uri: lb://order-service
          predicates:
            # /api/auth/** (login/register) and /api/orders/** both live on
            # order-service, so both patterns route to the same target here.
            - Path=/api/auth/**,/api/orders/**
        - id: inventory-service
          uri: lb://inventory-service
          predicates:
            - Path=/api/inventory/**
        - id: payment-service
          uri: lb://payment-service
          predicates:
            - Path=/api/payments/**
        - id: notification-service
          uri: lb://notification-service
          predicates:
            - Path=/api/notifications/**
        - id: ai-risk-service
          uri: lb://ai-risk-service
          predicates:
            - Path=/api/risk/**

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URI:http://localhost:8761/eureka}
    fetch-registry: true
    register-with-eureka: true
  instance:
    prefer-ip-address: true

app:
  jwt:
    secret: ${JWT_SECRET:codekerdos-demo-secret-change-in-prod-min-32-chars}
    expiration-ms: 86400000
  security:
    # Ant-style path patterns the JwtValidationGatewayFilter lets through
    # without a token — /api/auth/** must stay public (login/register), plus
    # actuator health/info and swagger/openapi so ops tooling and docs work
    # unauthenticated.
    public-paths: /api/auth/**,/actuator/health,/actuator/info,/v3/api-docs/**,/swagger-ui/**

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,gateway
  tracing:
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      endpoint: ${ZIPKIN_ENDPOINT:http://localhost:9411/api/v2/spans}
