services:
  postgres:
    image: postgres:16-alpine
    container_name: order-platform-postgres
    environment:
      # Project 2 uses ONE shared dev database for all 5 business services
      # (see docs/CONVENTIONS.md) — each service's JPA entities use distinct
      # table names (app_users/orders, inventory_items, payments,
      # notifications, risk_decision_logs) so there's no collision.
      POSTGRES_DB: order_platform_db
      POSTGRES_USER: orderplatform
      POSTGRES_PASSWORD: orderplatform
    ports:
      - "5432:5432"
    volumes:
      - order_platform_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orderplatform -d order_platform_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: order-platform-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Single-node KRaft broker — no Zookeeper needed. PLAINTEXT is for other
  # containers on this network; PLAINTEXT_HOST is for the host machine
  # (IDE / mvnw runs) via localhost:29092.
  kafka:
    image: apache/kafka:3.7.1
    container_name: order-platform-kafka
    ports:
      - "29092:29092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,PLAINTEXT_HOST://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s

  zipkin:
    image: openzipkin/zipkin
    container_name: order-platform-zipkin
    ports:
      - "9411:9411"

  eureka-server:
    build: ../eureka-server
    container_name: eureka-server
    ports:
      - "8761:8761"
    healthcheck:
      test: ["CMD-SHELL", "echo > /dev/tcp/localhost/8761"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  api-gateway:
    build: .
    container_name: api-gateway
    ports:
      - "8080:8080"
    environment:
      EUREKA_URI: http://eureka-server:8761/eureka
      JWT_SECRET: ${JWT_SECRET:-codekerdos-demo-secret-change-in-prod-min-32-chars}
      ZIPKIN_ENDPOINT: http://zipkin:9411/api/v2/spans
    depends_on:
      eureka-server:
        condition: service_healthy

  order-service:
    build: ../order-service
    container_name: order-service
    ports:
      - "8081:8081"
    environment:
      SPRING_PROFILES_ACTIVE: postgres
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/order_platform_db
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      REDIS_HOST: redis
      EUREKA_URI: http://eureka-server:8761/eureka
      JWT_SECRET: ${JWT_SECRET:-codekerdos-demo-secret-change-in-prod-min-32-chars}
      ZIPKIN_ENDPOINT: http://zipkin:9411/api/v2/spans
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      eureka-server:
        condition: service_healthy

  inventory-service:
    build: ../inventory-service
    container_name: inventory-service
    ports:
      - "8082:8082"
    environment:
      SPRING_PROFILES_ACTIVE: postgres
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/order_platform_db
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      REDIS_HOST: redis
      EUREKA_URI: http://eureka-server:8761/eureka
      JWT_SECRET: ${JWT_SECRET:-codekerdos-demo-secret-change-in-prod-min-32-chars}
      ZIPKIN_ENDPOINT: http://zipkin:9411/api/v2/spans
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      eureka-server:
        condition: service_healthy

  payment-service:
    build: ../payment-service
    container_name: payment-service
    ports:
      - "8083:8083"
    environment:
      SPRING_PROFILES_ACTIVE: postgres
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/order_platform_db
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      REDIS_HOST: redis
      EUREKA_URI: http://eureka-server:8761/eureka
      JWT_SECRET: ${JWT_SECRET:-codekerdos-demo-secret-change-in-prod-min-32-chars}
      ZIPKIN_ENDPOINT: http://zipkin:9411/api/v2/spans
      MAX_AUTO_APPROVE_AMOUNT: ${MAX_AUTO_APPROVE_AMOUNT:-5000}
      RANDOM_FAILURE_RATE: ${RANDOM_FAILURE_RATE:-0.10}
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      eureka-server:
        condition: service_healthy

  notification-service:
    build: ../notification-service
    container_name: notification-service
    ports:
      - "8084:8084"
    environment:
      SPRING_PROFILES_ACTIVE: postgres
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/order_platform_db
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      REDIS_HOST: redis
      EUREKA_URI: http://eureka-server:8761/eureka
      JWT_SECRET: ${JWT_SECRET:-codekerdos-demo-secret-change-in-prod-min-32-chars}
      ZIPKIN_ENDPOINT: http://zipkin:9411/api/v2/spans
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      eureka-server:
        condition: service_healthy

  ai-risk-service:
    build: ../ai-risk-service
    container_name: ai-risk-service
    ports:
      - "8085:8085"
    environment:
      SPRING_PROFILES_ACTIVE: postgres
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/order_platform_db
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      REDIS_HOST: redis
      EUREKA_URI: http://eureka-server:8761/eureka
      JWT_SECRET: ${JWT_SECRET:-codekerdos-demo-secret-change-in-prod-min-32-chars}
      ZIPKIN_ENDPOINT: http://zipkin:9411/api/v2/spans
      GROQ_API_KEY: ${GROQ_API_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      eureka-server:
        condition: service_healthy

volumes:
  order_platform_pg:
